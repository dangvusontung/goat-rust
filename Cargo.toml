[workspace]
members = [
    "crates/goat-rng",
    "crates/goat-fixed",
    "crates/goat-core",
    "crates/goat-match",
    "crates/goat-world",
    "crates/goat-meta",
    "crates/goat-save",
    "crates/goat-calendar",
    "crates/goat-traits",
    "crates/goat-tui",
    "crates/goat-bridge",
    "crates/goat-web",
    "crates/goat-training",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
flutter_rust_bridge = "=2.9.0"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
